<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3f87">
<title>Calculadora Laboratorio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Calculadora de precios <small>Lista 2026</small></h1>
  <input id="buscar" type="search" placeholder="Buscar servicio…" autocomplete="off">
  <div id="chips"></div>
</header>
<main id="lista"></main>
<footer>
  <div id="resumen"><small id="cuenta">0 unidades</small><div id="total">$0</div></div>
  <button id="limpiar" disabled>Limpiar</button>
</footer>

<div id="hoja">
  <div id="fondo"></div>
  <div id="panel">
    <h2>Desglose del pedido</h2>
    <div id="detalle"></div>
    <div class="tot-final"><span>Total</span><span id="total-detalle"></span></div>
    <button id="cerrar">Cerrar</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
